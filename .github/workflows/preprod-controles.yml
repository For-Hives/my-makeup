# The checks on the pre-production, run by hand (ticket 174, docs/preprod.md, « Les contrôles par
# la CI »). One « Run workflow » on v3 puts the pre-production back to its seeded state, then plays
# the quick journeys (the version served and the page of the fictional profile) and the check of a
# host (every address of the inventory, read-only).
#
# Nobody types a password: the protected access of the pre-production and the token of Coolify come
# from the secrets of the repository, are sent in headers and are never printed.
#
# Rules, enforced by the guard rails of every workflow (tests/ci/garde-fous-ci.test.ts and
# tests/unit/preprod-controles-ci.test.ts):
# - it starts by hand only, and only from v3: the token of Coolify is never given to the code of
#   another branch;
# - its one target is https://preprod.my-makeup.fr, written in this file; the site is never a target
#   (U86). The reset is refused by the script unless Coolify says the application is the
#   pre-production, and by the application unless the database is the one of the pre-production;
# - no `bun install`: the scripts import no installed dependency, so no code of a dependency runs next
#   to the secrets;
# - its secrets are in the allowed list of the guard, by name.
name: Contrôles préprod

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Two runs at once would reset the same pre-production twice: the second waits.
concurrency:
  group: preprod-controles
  cancel-in-progress: false

jobs:
  controles:
    name: preprod-controles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse any branch but v3
        run: test "$GITHUB_REF" = "refs/heads/v3" || exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Put the pre-production back to its seeded state
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
          PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
          REMISE_IDENTIFIANT: ${{ github.run_id }}
          REMISE_TENTATIVE: ${{ github.run_attempt }}
        run: |
          echo '### Remise à zéro de la préprod' >> "$GITHUB_STEP_SUMMARY"
          bun run preprod:remise-ci 2>&1 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Quick journeys on the pre-production
        env:
          PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
          PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
        run: |
          echo '### Parcours rapides' >> "$GITHUB_STEP_SUMMARY"
          bun run preprod:controle 2>&1 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check every address of the inventory on the pre-production
        env:
          CONTROLE_HOTE_CIBLE: https://preprod.my-makeup.fr
          PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
          PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
        run: |
          echo '### Contrôle de l’hôte' >> "$GITHUB_STEP_SUMMARY"
          bun run bascule:controle 2>&1 | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
