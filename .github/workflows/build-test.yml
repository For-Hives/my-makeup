name: Build and Test
env:
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_URL: ${{vars.NEXT_PUBLIC_URL}}
  NEXTAUTH_SECRET: ${{secrets.NEXTAUTH_SECRET}}
  NEXTAUTH_URL: ${{secrets.NEXTAUTH_URL}}
  GOOGLE_CLIENT_ID: ${{secrets.GOOGLE_CLIENT_ID}}
  GOOGLE_CLIENT_SECRET: ${{secrets.GOOGLE_CLIENT_SECRET}}
  MAILGUN_API_KEY: ${{secrets.MAILGUN_API_KEY}}
  MAILGUN_API_URL: ${{secrets.MAILGUN_API_URL}}
  MAILGUN_PUBLIC_KEY: ${{secrets.MAILGUN_PUBLIC_KEY}}
  MAILGUN_DOMAIN: ${{secrets.MAILGUN_DOMAIN}}

on:
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 22.x
      - name: Install dependencies in production
        run: npm ci --ignore-scripts
      - name: Unit tests (src/lib)
        run: npm test
      # Only Next's own compilation cache, never the build output: the build
      # always runs and starts from a clean .next
      - name: Cache Next.js compilation
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.js', 'jsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Build the app
        run: npm run build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Just Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ secrets.APP_IMAGE }}
          build-args:
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_URL=${{ vars.NEXT_PUBLIC_URL }}

  # AF-01 to AF-10 (plans/02): NextAuth and the private pages against a fake
  # Strapi started by the script. The servers under test get their own
  # environment (local API, generated secret), never the variables above.
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 22.x
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Auth tests (fake Strapi)
        run: npm run test:auth
      - name: Show the server logs
        if: failure()
        run: tail -n 100 .next-test-auth-journaux/*.log

  # RG-01 to RG-08, pictures and forgotten password (plans/02), and the
  # public pages (UI-06, UI-07, SEO-10, SEO-12): Chromium against a fake
  # Strapi started by the script, with the same isolated environment as the
  # auth job. Screenshots and traces of the failed tests are kept.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 22.x
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Regression scenarios (fake Strapi)
        run: npm run test:regression
      - name: Show the server logs
        if: failure()
        run: tail -n 100 .next-test-regression-journaux/*.log
      - name: Keep the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces
          path: .next-test-regression-journaux/resultats
          if-no-files-found: ignore
