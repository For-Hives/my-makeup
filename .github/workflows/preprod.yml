# The check of the pre-production (ticket 027, docs/preprod.md). Coolify deploys each push on v3
# to https://preprod.my-makeup.fr by itself; this workflow waits until the pre-production serves
# the pushed commit, then reads the public page of the fictional profile that the pre-production
# imports from the fake Strapi source when it starts on an empty database: 200, its name in the
# only h1.
#
# Rules, enforced by the guard rails of every workflow (tests/ci/garde-fous-ci.test.ts):
# - it reads two secrets of the repository, the protected access of the pre-production, and
#   nothing else: their names are in the allowed list of the guard;
# - no `bun install`: the script imports no dependency, so no code of a dependency runs next to
#   the secrets;
# - it is not a required check: a red run says the pre-production is behind or broken, it blocks
#   no merge.
name: Préprod

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push replaces the check of the older one: only the last commit is deployed.
concurrency:
  group: preprod
  cancel-in-progress: true

jobs:
  profil-fictif:
    name: preprod-profil-fictif
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Until the owner sets the two secrets of the protected access, there is nothing to read with:
      # the check is skipped with a warning on the run, never red. The script is tested as it is
      # (tests/ci/garde-fous-ci.test.ts, « preprod.yml »).
      - name: Secrets of the pre-production
        id: acces
        env:
          PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
          PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
        run: |
          if [ -n "$PREPROD_BASIC_AUTH_USER" ] && [ -n "$PREPROD_BASIC_AUTH_PASSWORD" ]; then
            echo "presents=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Contrôle de la préprod sauté : les secrets PREPROD_BASIC_AUTH_USER et PREPROD_BASIC_AUTH_PASSWORD ne sont pas posés dans le dépôt (docs/preprod.md)."
            echo "presents=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the page of the fictional profile on the pre-production
        if: steps.acces.outputs.presents == 'true'
        env:
          PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
          PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
          CONTROLE_PREPROD_COMMIT: ${{ github.sha }}
        run: bun run preprod:controle
